<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provena Gate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a review console. Left rail = account, library, past deliveries; main = the delivery under review, summary first. */
:root {
  --bg: #0d1118; --bg-2: #111724; --panel: #151c29; --panel-2: #1a2232; --ink: #e9edf3; --muted: #93a0b4; --line: #243046;
  --accent: #8b88ff; --accent-2: #b8b6ff; --glow: rgba(139, 136, 255, .35);
  --approve: #4fd18b; --hold: #ff7a63; --review: #f2b54b; --chip: #1f2838;
  --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
body { margin: 0; color: var(--ink); font: 14px/1.5 var(--sans);
  background: radial-gradient(1200px 600px at 85% -10%, rgba(139, 136, 255, .14), transparent 60%),
              radial-gradient(900px 500px at -10% 110%, rgba(79, 209, 139, .07), transparent 60%), var(--bg) }
header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
  padding: 14px max(20px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line);
  background: rgba(13, 17, 24, .78); backdrop-filter: blur(12px) }
header h1 { font: 700 19px var(--display); margin: 0; display: flex; align-items: center; gap: 10px; letter-spacing: -0.01em }
header h1 i { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #5b57e8); position: relative; box-shadow: 0 0 18px var(--glow) }
header h1 i::after { content: ""; position: absolute; inset: 6px; border: 2px solid var(--bg); border-radius: 2px }
header h1 span { color: var(--accent-2) }
.status { color: var(--muted); font-size: 12.5px; flex: 1; display: flex; align-items: center; gap: 8px }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--approve); box-shadow: 0 0 10px var(--approve) }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; padding: 22px max(20px, env(safe-area-inset-right, 0px)) 48px max(20px, env(safe-area-inset-left, 0px)) }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr) } }
section { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0;
  box-shadow: 0 20px 40px -30px rgba(0, 0, 0, .8) }
.rail { display: grid; gap: 18px; align-content: start } .stack { display: grid; gap: 18px; align-content: start; min-width: 0 }
h2 { font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--accent-2); margin: 0 }
h3 { font: 600 20px var(--display); margin: 0; letter-spacing: -0.01em }
label { display: grid; gap: 5px; font-size: 12.5px; color: var(--muted) }
input, select, button { font: inherit; color: var(--ink) }
input[type=text], input[type=number], select { background: var(--bg-2); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; width: 100%; transition: border-color .2s, box-shadow .2s }
input[type=text]:focus, input[type=number]:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow) }
input[type=file] { color: var(--muted); font-size: 12.5px }
input[type=file]::file-selector-button { background: var(--chip); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin-right: 10px; cursor: pointer }
button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px }
button { background: linear-gradient(135deg, var(--accent), #6a66f0); color: #0d1118; border: 0; border-radius: 9px; padding: 9px 16px; font-weight: 600; cursor: pointer;
  box-shadow: 0 8px 20px -10px var(--glow); transition: transform .15s ease, filter .15s ease }
button:hover { filter: brightness(1.1); transform: translateY(-1px) }
button.quiet { background: var(--chip); color: var(--ink); box-shadow: none; border: 1px solid var(--line) }
button:disabled { opacity: .55; cursor: wait; transform: none }
#delSubmit:disabled { background: linear-gradient(90deg, #5b57e8, var(--accent), #5b57e8); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; opacity: 1 }
@keyframes shimmer { to { background-position: -200% 0 } }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end } .row > label { flex: 1 1 120px }
.muted { color: var(--muted) } .small { font-size: 12.5px } .mono, td.num { font-family: var(--mono); font-variant-numeric: tabular-nums }
.list { display: grid; gap: 3px; max-height: 220px; overflow: auto; font-size: 13px }
.list button { background: none; color: var(--ink); text-align: left; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; box-shadow: none; font-weight: 500 }
.list button:hover, .list button.on { background: var(--chip); transform: none }
.list button.on { box-shadow: inset 2px 0 0 var(--accent) }
.split { display: grid; gap: 14px }
.bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--chip) }
.bar i { display: block }
.totals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px }
@media (max-width: 760px) { .totals { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
.total { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px }
.total b { display: block; font: 600 30px var(--display); letter-spacing: -0.02em; font-variant-numeric: tabular-nums }
.total span { font-size: 12.5px; color: var(--muted); display: flex; align-items: center }
.total:nth-child(2) b { color: var(--approve) } .total:nth-child(3) b { color: var(--hold) } .total:nth-child(4) b { color: var(--review) }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 500; background: var(--chip); white-space: nowrap; border: 1px solid var(--line) }
.pill.hold { color: var(--hold); border-color: rgba(255, 122, 99, .35); background: rgba(255, 122, 99, .1) }
.pill.release { color: var(--approve); border-color: rgba(79, 209, 139, .35); background: rgba(79, 209, 139, .1) }
.pill.escalate { color: var(--review); border-color: rgba(242, 181, 75, .35); background: rgba(242, 181, 75, .1) }
.pill.static { color: var(--muted) }
.thread { margin-top: 8px; padding: 10px 12px; background: rgba(139, 136, 255, .1); border: 1px solid rgba(139, 136, 255, .3); border-radius: 10px; line-height: 1.55 }
.actions { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px }
.table { overflow-x: auto } table { border-collapse: collapse; width: 100%; font-size: 13px }
th { text-align: left; font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line) }
td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top } td.reason { min-width: 240px; max-width: 360px; color: #c3cbd8 }
tbody tr:not(.evrow):hover td { background: rgba(139, 136, 255, .05) }
.report { white-space: pre-wrap; border-left: 2px solid var(--accent); padding: 4px 0 4px 16px; color: #d3d9e3; line-height: 1.6 }
.banner { padding: 12px 14px; border-radius: 10px; background: rgba(242, 181, 75, .08); border: 1px solid rgba(242, 181, 75, .3); font-size: 13px }
.files { display: grid; gap: 6px; max-height: 240px; overflow: auto }
.files .row { flex-wrap: nowrap } .files .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px }
.files input { max-width: 160px; padding: 6px 9px }
details summary { cursor: pointer; color: var(--muted); font-size: 13px }
.log { font-size: 12.5px; display: grid; gap: 5px; margin-top: 10px } .log div { display: grid; grid-template-columns: 64px 82px 1fr; gap: 10px }
.empty { color: var(--muted); padding: 36px 0; text-align: center }
button.ev { margin-top: 8px; padding: 5px 12px; font-size: 12px; background: var(--chip); color: var(--accent-2); border: 1px solid rgba(139, 136, 255, .35); box-shadow: none }
.evrow td { background: var(--bg-2) } .evidence { display: grid; gap: 12px; margin-bottom: 10px }
.frames { display: flex; gap: 10px; flex-wrap: wrap } figure { margin: 0; display: grid; gap: 4px }
figure img { width: 220px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block; box-shadow: 0 10px 24px -14px rgba(0, 0, 0, .9) }
figure.missing { width: 220px; height: 124px; display: grid; place-items: center; border: 1px dashed var(--line); border-radius: 8px }
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .7s cubic-bezier(.3, .7, .2, 1) }
  #result > section { animation: rise .55s cubic-bezier(.2, .7, .2, 1) both }
  #result > section:nth-child(2) { animation-delay: .08s } #result > section:nth-child(3) { animation-delay: .16s } #result > section:nth-child(4) { animation-delay: .24s }
  .evrow:not([hidden]) td { animation: rise .4s ease both }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
}
</style>
</head>
<body>
<header>
  <h1><i aria-hidden="true"></i>Provena <span>Gate</span></h1>
  <div class="status" id="status">Loading…</div>
  <label class="small" style="grid-auto-flow: column; align-items: center">Account
    <select id="account"></select></label>
</header>
<main>
  <div class="rail">
    <section>
      <h2>New account</h2>
      <form id="newAccount" class="row">
        <label>Name <input type="text" id="accName" required placeholder="e.g. Acme Robotics"></label>
        <label class="small" style="display: flex; gap: 6px; align-items: center; flex: 1 1 100%">
          <input type="checkbox" id="accShare"> Compare fingerprints with other buyers (opt-in)</label>
        <button>Create</button>
      </form>
    </section>
    <section>
      <h2>Library</h2>
      <div class="small muted" id="libCount">Footage this account already owns.</div>
      <form id="libForm" class="row">
        <label>Add clips <input type="file" id="libFiles" multiple accept="video/*" required></label>
        <button>Add</button>
      </form>
      <div class="list" id="libList"></div>
    </section>
    <section>
      <h2>Deliveries</h2>
      <div class="list" id="delList"></div>
    </section>
  </div>
  <div class="stack">
    <section>
      <h2>Check a delivery</h2>
      <form id="delForm" class="row">
        <label>Vendor <input type="text" id="vendor" required placeholder="e.g. Northlight Data"></label>
        <label>Rate per hour ($) <input type="number" id="rate" required min="0" step="0.01" value="150"></label>
        <label>Invoice total ($) <input type="number" id="invoice" required min="0" step="0.01"></label>
        <label style="flex: 1 1 100%">Clips <input type="file" id="delFiles" multiple accept="video/*" required></label>
        <div class="files" id="fileRows" style="flex: 1 1 100%"></div>
        <button id="delSubmit">Check delivery</button>
        <span class="small muted" id="delHint"></span>
      </form>
    </section>
    <div id="result" class="stack"><section><div class="empty">Pick a delivery on the left, or check a new one.</div></section></div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const money = n => "$" + (n ?? 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const secs = (a, b) => `${a.toFixed(1)}–${b.toFixed(1)} s`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const ACTION = {hold: "Hold", escalate: "Person decides", release: "Released"};
const KIND = {repeat_in_delivery: "Repeat in delivery", in_own_library: "Already in library",
              sold_to_other_buyer: "Sold to another buyer", public_dataset: "Public dataset"};
let accounts = [], current = null, selected = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `${r.status} ${r.statusText}`);
  return body;
}

async function loadStatus() {
  const s = await api("/api/status");
  $("status").textContent = `${s.public_clips.toLocaleString()} public dataset clips indexed (${s.public_datasets.length} datasets) · ` +
    (s.agent ? "Claude review on" : "Claude review off: rules only");
}

async function loadAccounts(pick) {
  accounts = await api("/api/accounts");
  $("account").innerHTML = accounts.map(a => `<option value="${a.id}">${esc(a.name)}${a.share_fingerprints ? " · sharing" : ""}</option>`).join("")
    || "<option>No accounts yet</option>";
  current = pick ?? current ?? accounts[0]?.id ?? null;
  if (current) $("account").value = current;
  await loadAccount();
}

async function loadAccount() {
  if (!current) return;
  const [lib, dels] = await Promise.all([api(`/api/accounts/${current}/library`), api(`/api/deliveries?account_id=${current}`)]);
  $("libCount").textContent = `${lib.length} clip${lib.length === 1 ? "" : "s"}, ${(lib.reduce((s, c) => s + c.duration, 0) / 60).toFixed(1)} min of footage this account already owns.`;
  $("libList").innerHTML = lib.slice(-50).reverse().map(c => `<div class="small" style="padding: 2px 8px">${esc(c.name)} <span class="muted mono">${c.duration.toFixed(1)} s</span></div>`).join("");
  $("delList").innerHTML = dels.map(d => `<button data-id="${d.id}" class="${d.id === selected ? "on" : ""}"><span>#${d.id} ${esc(d.vendor)}</span><span class="muted">${money(d.invoice_total)} · ${d.status}</span></button>`).join("")
    || `<div class="small muted">No deliveries yet.</div>`;
  $("delList").querySelectorAll("button").forEach(b => b.onclick = () => showDelivery(+b.dataset.id));
}

async function showDelivery(id) {
  selected = id;
  render(await api(`/api/deliveries/${id}`));
  loadAccount();
}

function render(d) {
  const s = d.split || {approved: 0, held: 0, review: 0};
  const total = d.delivery.invoice_total || 1;
  const w = n => `${Math.max(0, 100 * n / total)}%`;
  const rows = d.findings.map(f => `<tr>
      <td>${esc(f.clip_name)}<div class="small muted">${esc(f.contributor)}</div></td>
      <td><span class="pill">${KIND[f.kind]}</span>${f.static ? ` <span class="pill static">static</span>` : ""}</td>
      <td class="num">${secs(f.clip_start, f.clip_end)}</td>
      <td>${esc(f.source)}${f.match_name ? `<div class="small muted">${esc(f.match_name)}</div>` : ""}${f.first_seen ? `<div class="small muted">first seen ${f.first_seen}</div>` : ""}${f.licence ? `<div class="small muted">licence: ${esc(f.licence)}</div>` : ""}</td>
      <td class="num">${f.votes}</td>
      <td class="num">${money(f.amount)}</td>
      <td><span class="pill ${f.action}">${ACTION[f.action] || f.action}</span><div class="small muted">by ${f.actor}</div></td>
      <td class="reason small">${esc(f.reason)}${f.disputes.map(x => `<div class="thread"><b>${esc(x.author)}:</b> ${esc(x.message)}<br><b>Claude:</b> ${esc(x.reply)} <span class="pill">${x.outcome === "escalate" ? "sent to a person" : "upheld"}</span></div>`).join("")}<div><button class="quiet ev" data-ev="${f.id}">Show evidence</button></div></td></tr>
      <tr class="evrow" id="ev${f.id}" hidden><td colspan="8"></td></tr>`).join("");
  $("result").innerHTML = `
    <section>
      <div class="row" style="justify-content: space-between">
        <h3>Delivery #${d.delivery.id} · ${esc(d.delivery.vendor)}</h3>
        <span class="small muted">${d.delivery.clips} clips · ${(d.delivery.seconds / 60).toFixed(1)} min · ${money(d.delivery.rate_per_hour)}/h · ${d.delivery.status}</span>
      </div>
      <div class="split">
        <div class="bar" role="img" aria-label="Invoice split"><i style="width:${w(s.approved)};background:var(--approve)"></i><i style="width:${w(s.held)};background:var(--hold)"></i><i style="width:${w(s.review)};background:var(--review)"></i></div>
        <div class="totals">
          <div class="total"><b>${money(d.delivery.invoice_total)}</b><span>Invoice</span></div>
          <div class="total"><b>${money(s.approved)}</b><span><i class="dot" style="background:var(--approve)"></i>Approved</span></div>
          <div class="total"><b>${money(s.held)}</b><span><i class="dot" style="background:var(--hold)"></i>Held</span></div>
          <div class="total"><b>${money(s.review)}</b><span><i class="dot" style="background:var(--review)"></i>Waiting for a person</span></div>
        </div>
        ${s.overbilled ? `<div class="banner">Billed ${money(s.overbilled)} more than the delivered footage is worth.</div>` : ""}
        ${s.whole_delivery_to_human ? `<div class="banner">Holds exceed the automatic limit, so the whole delivery goes to a person.</div>` : ""}
        ${d.agent_note ? `<div class="banner">${esc(d.agent_note)}</div>` : ""}
        ${Object.keys(d.errors).length ? `<div class="banner">Could not read: ${Object.keys(d.errors).map(esc).join(", ")}</div>` : ""}
      </div>
    </section>
    ${d.buyer_report ? `<section><h2>Claude's review</h2><div class="report">${esc(d.buyer_report)}</div></section>` : ""}
    <section>
      <h2>Findings (${d.findings.length})</h2>
      ${d.findings.length ? `<div class="table"><table><thead><tr><th>Clip</th><th>What</th><th>Seconds</th><th>Matches</th><th>Frames</th><th>Value</th><th>Action</th><th>Why</th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="empty">No duplicate, owned, resold or public footage found. The whole invoice is approved.</div>`}
    </section>
    ${d.contributor_notes.length ? `<section><h2>Notes to contributors</h2>${d.contributor_notes.map(n => `<div class="small">${esc(n)}</div>`).join("")}</section>` : ""}
    <section><details><summary>Decision log (${d.log.length} steps)</summary><div class="log">${d.log.map(l =>
      `<div><span class="muted">${l.actor}</span><span>${l.action}</span><span class="muted">${esc(l.reason).slice(0, 400)}</span></div>`).join("")}</div></details></section>`;
  $("result").querySelectorAll("button.ev").forEach(b => b.onclick = () => toggleEvidence(d.delivery.id, +b.dataset.ev, b));
}

async function toggleEvidence(deliveryId, findingId, button) {
  const row = $(`ev${findingId}`), cell = row.firstElementChild;
  if (!row.hidden) { row.hidden = true; button.textContent = "Show evidence"; return; }
  row.hidden = false; button.textContent = "Hide evidence";
  if (cell.dataset.loaded) return;
  cell.innerHTML = `<div class="small muted">Loading frames…</div>`;
  try {
    const e = await api(`/api/deliveries/${deliveryId}/findings/${findingId}/evidence`);
    const strip = (title, frames) => `<div class="strip"><div class="small muted">${title}</div><div class="frames">${frames.map(x =>
      x.src ? `<figure><img src="${x.src}" alt="frame at ${x.t} s"><figcaption class="mono small">${x.t.toFixed(1)} s</figcaption></figure>`
            : `<figure class="missing small muted">no frame</figure>`).join("")}</div></div>`;
    cell.innerHTML = `<div class="evidence">${strip("Delivered clip", e.clip)}${e.match ? strip("Match", e.match) : ""}</div>${e.note ? `<div class="banner">${esc(e.note)}</div>` : ""}
      <div class="actions">
        <form class="row disputeForm"><label>Dispute as <input type="text" name="author" required placeholder="contributor or vendor"></label>
          <label style="flex: 3 1 260px">Message <input type="text" name="message" required placeholder="e.g. I filmed this myself last week"></label>
          <button>Send dispute</button></form>
        <form class="row decideForm"><label style="flex: 3 1 260px">Person's decision <input type="text" name="reason" placeholder="reason (optional)"></label>
          <button class="quiet" value="hold">Keep holding</button><button value="release">Release payment</button></form>
      </div>`;
    cell.dataset.loaded = "1";
    cell.querySelector(".disputeForm").onsubmit = async ev => {
      ev.preventDefault(); const b = ev.submitter; b.disabled = true; b.textContent = "Claude is reviewing…";
      const fd = new FormData(ev.target);
      try { const d = await api(`/api/deliveries/${deliveryId}/findings/${findingId}/disputes`, {method: "POST",
          headers: {"content-type": "application/json"}, body: JSON.stringify({author: fd.get("author"), message: fd.get("message")})});
        render(d); reopen(d.delivery.id, findingId);
      } catch (err) { alertBox(err.message); b.disabled = false; b.textContent = "Send dispute"; }
    };
    cell.querySelector(".decideForm").onsubmit = async ev => {
      ev.preventDefault();
      try { const d = await api(`/api/deliveries/${deliveryId}/findings/${findingId}/decision`, {method: "POST",
          headers: {"content-type": "application/json"}, body: JSON.stringify({action: ev.submitter.value, reason: new FormData(ev.target).get("reason")})});
        render(d); reopen(d.delivery.id, findingId); loadAccount();
      } catch (err) { alertBox(err.message); }
    };
  } catch (err) { cell.innerHTML = `<div class="banner">${esc(err.message)}</div>`; }
}

$("account").onchange = e => { current = +e.target.value; selected = null; loadAccount(); };
$("newAccount").onsubmit = async e => {
  e.preventDefault();
  try { const a = await api("/api/accounts", {method: "POST", headers: {"content-type": "application/json"},
      body: JSON.stringify({name: $("accName").value, share_fingerprints: $("accShare").checked})});
    $("accName").value = ""; await loadAccounts(a.id);
  } catch (err) { alertBox(err.message); }
};
$("libForm").onsubmit = async e => {
  e.preventDefault();
  const fd = new FormData(); [...$("libFiles").files].forEach(f => fd.append("files", f));
  const b = e.submitter; b.disabled = true; b.textContent = "Adding…";
  try { const r = await api(`/api/accounts/${current}/library`, {method: "POST", body: fd});
    if (Object.keys(r.errors).length) alertBox("Could not read: " + Object.keys(r.errors).join(", "));
    $("libFiles").value = ""; await loadAccounts();
  } catch (err) { alertBox(err.message); } finally { b.disabled = false; b.textContent = "Add"; }
};
$("delFiles").onchange = () => {
  $("fileRows").innerHTML = [...$("delFiles").files].map((f, i) =>
    `<div class="row"><span class="name">${esc(f.name)}</span><input type="text" id="who${i}" placeholder="Contributor"></div>`).join("");
};
$("delForm").onsubmit = async e => {
  e.preventDefault();
  const files = [...$("delFiles").files], who = {};
  const fd = new FormData();
  files.forEach((f, i) => { fd.append("files", f); who[f.name] = $(`who${i}`).value.trim(); });
  for (const [k, v] of [["account_id", current], ["vendor", $("vendor").value], ["rate_per_hour", $("rate").value],
                        ["invoice_total", $("invoice").value], ["contributors", JSON.stringify(who)]]) fd.append(k, v);
  $("delSubmit").disabled = true; $("delHint").textContent = `Checking ${files.length} clips against your library, other buyers and public datasets, then Claude reviews…`;
  try { const d = await api("/api/deliveries", {method: "POST", body: fd});
    selected = d.delivery.id; render(d); $("delForm").reset(); $("fileRows").innerHTML = ""; await loadAccount();
  } catch (err) { alertBox(err.message); } finally { $("delSubmit").disabled = false; $("delHint").textContent = ""; }
};
function reopen(deliveryId, findingId) {
  const b = $("result").querySelector(`button.ev[data-ev="${findingId}"]`);
  if (b) toggleEvidence(deliveryId, findingId, b);
}
function alertBox(msg) { $("result").insertAdjacentHTML("afterbegin", `<section><div class="banner">${esc(msg)}</div></section>`); }

loadStatus(); loadAccounts();
</script>
</body>
</html>

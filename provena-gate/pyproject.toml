[project]
name = "provena-gate"
version = "0.1.0"
description = "Checks video data deliveries for duplicate, edited and public-dataset footage before payment"
requires-python = ">=3.11"
dependencies = ["provena-audit[index]", "anthropic", "fastapi", "uvicorn", "python-multipart", "remotezip"]

[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
provena-audit = { path = "../provena-audit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gate"]

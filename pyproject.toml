[project]
name = "provena"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["audit", "core", "fingerprint[vpdq]", "ingest", "matcher", "store"]

[dependency-groups]
dev = ["pytest", "remotezip", "requests", "stream-unzip"]

[tool.uv.sources]
audit = { workspace = true }
core = { workspace = true }
fingerprint = { workspace = true }
ingest = { workspace = true }
matcher = { workspace = true }
store = { workspace = true }

[tool.uv.workspace]
members = ["packages/core", "packages/fingerprint", "packages/matcher", "packages/store", "services/audit", "services/ingest"]

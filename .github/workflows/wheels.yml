# Build provena-audit wheels for Linux, Windows and macOS.
name: wheels

on:
  push:
    branches: [provena-audit]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-latest, arch: aarch64}
          - {os: windows-latest, arch: AMD64}
          - {os: macos-14, arch: x86_64}  # Intel wheel cross-built on Apple Silicon
          - {os: macos-14, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: provena-audit
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist provena-audit --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz


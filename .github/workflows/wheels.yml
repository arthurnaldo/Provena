# Build provena-audit wheels for Linux, Windows and macOS; publish to PyPI on a v* tag (trusted publishing).
name: wheels

on:
  push:
    branches: [provena-audit]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  wheels:
    name: wheels ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x86_64}
          - {os: ubuntu-latest, arch: aarch64}
          - {os: windows-latest, arch: AMD64}
          - {os: macos-13, arch: x86_64}
          - {os: macos-14, arch: arm64}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - uses: pypa/cibuildwheel@v3.2.1
        with:
          package-dir: provena-audit
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist provena-audit --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "provena-audit"
version = "0.2.0"
description = "Find duplicate and near-duplicate footage in a video library. Only small fingerprints leave your machines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["video", "deduplication", "fingerprint", "pdq", "near-duplicate", "dataset"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["av", "numpy", "pdqhash", "fsspec"]

[project.optional-dependencies]
cloud = ["s3fs", "gcsfs"]
index = ["pyarrow"]  # dataset metadata (clips.parquet) in lookups

[project.scripts]
provena-audit = "provena_audit.cli:main"

[dependency-groups]
dev = ["pytest", "remotezip"]

[tool.scikit-build]
wheel.packages = ["src/provena_audit"]
wheel.exclude = ["provena_audit/kernel.cpp"]
sdist.exclude = ["tests", "uv.lock"]

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
test-command = "provena-audit --help"

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

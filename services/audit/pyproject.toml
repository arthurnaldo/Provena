[project]
name = "audit"
version = "0.1.0"
description = "Dataset audit: customers fingerprint their own folder, we find duplicates, they render evidence locally."
requires-python = ">=3.11"
dependencies = ["core", "fingerprint", "fsspec", "matcher", "store", "numpy"]

[project.optional-dependencies]
cloud = ["gcsfs", "s3fs"]

[project.scripts]
provena-audit = "audit.cli:main"

[tool.uv.sources]
core = { workspace = true }
fingerprint = { workspace = true }
matcher = { workspace = true }
store = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
